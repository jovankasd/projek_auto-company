; ==============================================================================
; XYZ Motors - Supervisor Queue Worker Configuration
; Reference: PRD §8 & PROMPT 4 (Async Notifications & Work Orders)
; File Path: /etc/supervisor/conf.d/xyz-motors-worker.conf
; ==============================================================================

[program:xyz-motors-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/xyz-motors/artisan queue:work --queue=high,default,low --sleep=3 --tries=3 --timeout=90 --max-jobs=1000 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/xyz-motors/storage/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=3600
